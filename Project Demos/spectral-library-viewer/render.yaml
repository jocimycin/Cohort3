services:
  - type: web
    name: spectral-library-viewer
    runtime: python
    buildCommand: pip install -r requirements.txt && python generate_samples.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 4 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    plan: free
